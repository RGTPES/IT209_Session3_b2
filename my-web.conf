server {
    listen 80;
    server_name _;

    # Thư mục web root chính của trang web
    root /var/www/my-web/html;
    index index.html index.htm;

    # Xử lý các request thông thường
    location / {
        try_files $uri $uri/ =404;
    }

    # Cấu hình trang lỗi tùy chỉnh (Custom Error Page 404)
    # Khi gặp lỗi 404, Nginx chuyển hướng nội bộ tới URI /404.html
    error_page 404 /404.html;

    # Thiết lập block location = /404.html
    # - root trỏ chính xác về thư mục chứa tệp: /var/www/my-web/html
    # - Chỉ thị 'internal' bảo vệ tệp tin: chỉ cho phép các yêu cầu nội bộ từ Nginx
    #   (như lệnh error_page) truy cập. Ngăn chặn người dùng từ Internet
    #   truy cập trực tiếp thông qua URL http://<IP>/404.html
    location = /404.html {
        root /var/www/my-web/html;
        internal;
    }
}
